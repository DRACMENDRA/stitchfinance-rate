name: Update BCV USD Rate

on:
  schedule:
    - cron: "0 */6 * * *"   # cada 6 horas
  workflow_dispatch:        # botón manual "Run workflow"

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download BCV rate JSON
        run: |
          mkdir -p data
          curl -s https://ve.dolarapi.com/v1/dolares/bcv > data/dolar.json

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/dolar.json
          git diff --staged --quiet || git commit -m "chore: update dolar.json"
          git push
