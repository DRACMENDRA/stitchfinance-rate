name: Update BCV USD Rate

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download BCV rate JSON (robust)
        run: |
          set -e
          mkdir -p data

          echo "📥 Descargando tasa BCV..."

          curl -L \
            -H "User-Agent: Mozilla/5.0" \
            -sS \
            https://ve.dolarapi.com/v1/dolares/oficial \
            -o data/dolar.tmp.json

          echo "Contenido descargado:"
          cat data/dolar.tmp.json

          if grep -q '"promedio"' data/dolar.tmp.json; then
            mv data/dolar.tmp.json data/dolar.json
            echo "✅ dolar.json actualizado"
          else
            echo "❌ Descarga inválida. No se reemplaza dolar.json"
            rm -f data/dolar.tmp.json
            exit 1
          fi

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/dolar.json
          git diff --staged --quiet || git commit -m "chore: update dolar.json"
          git push
